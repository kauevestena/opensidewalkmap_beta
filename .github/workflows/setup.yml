name: node_setup

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  node_setup:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oswm_codebase/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - run: python -m pip install -r oswm_codebase/requirements.txt
      - run: bash oswm_codebase/runners/setup.sh
      - name: Commit generated setup files
        run: |
          python oswm_codebase/node_outputs.py --root . stage setup
          python oswm_codebase/node_outputs.py --root . validate-sizes --max-mib 95
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: initialize OSWM node"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
