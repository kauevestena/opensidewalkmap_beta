name: Curitiba incremental OSM preview

on:
  push:
    branches: ["pilot/geofabrik-incremental-curitiba"]
    paths: [".github/workflows/data_daily_updating.yml"]
  workflow_dispatch:
    inputs:
      bootstrap_url:
        description: Optional retained regional snapshot for a bounded replay
        type: string
        default: ""
      start_sequence:
        description: Embedded sequence of the replay baseline
        type: string
        default: ""
      end_sequence:
        description: Published target sequence for the replay
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: oswm-replication-preview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    permissions:
      contents: read
    uses: kauevestena/oswm_codebase/.github/workflows/node_replication_preview.yml@f46fb97f98b5cbdeaa770ba6c2d62fa40f2331e3
    with:
      core_ref: f46fb97f98b5cbdeaa770ba6c2d62fa40f2331e3
      bootstrap_url: ${{ inputs.bootstrap_url }}
      start_sequence: ${{ inputs.start_sequence }}
      end_sequence: ${{ inputs.end_sequence }}
