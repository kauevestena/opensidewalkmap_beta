name: Curitiba incremental OSM preview

on:
  workflow_dispatch:
    inputs:
      bootstrap_url:
        description: Optional retained regional snapshot for a bounded replay
        type: string
        default: "https://download.geofabrik.de/south-america/brazil/sul-261027.osm.pbf"
      start_sequence:
        description: Embedded sequence of the replay baseline
        type: string
        default: "2504"
      end_sequence:
        description: Published target sequence for the replay
        type: string
        default: "2506"

permissions:
  contents: read

concurrency:
  group: oswm-replication-preview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    permissions:
      contents: read
    uses: kauevestena/oswm_codebase/.github/workflows/node_replication_preview.yml@51e5266be40a29b1fe30d29650ba2ecf216200e8
    with:
      core_ref: 51e5266be40a29b1fe30d29650ba2ecf216200e8
      bootstrap_url: ${{ inputs.bootstrap_url }}
      start_sequence: ${{ inputs.start_sequence }}
      end_sequence: ${{ inputs.end_sequence }}
