name: Curitiba incremental OSM preview

on:
  push:
    branches: ["pilot/geofabrik-incremental-curitiba"]
    paths: [".github/workflows/data_daily_updating.yml"]
  workflow_dispatch:
    inputs:
      bootstrap_url:
        description: Optional retained regional snapshot for a bounded replay
        type: string
        default: "https://download.geofabrik.de/south-america/brazil/sul-261027.osm.pbf"
      start_sequence:
        description: Embedded sequence of the replay baseline
        type: string
        default: "2504"
      end_sequence:
        description: Published target sequence for the replay
        type: string
        default: "2506"

permissions:
  contents: read

concurrency:
  group: oswm-replication-preview-${{ github.repository }}
  cancel-in-progress: false

jobs:
  preview:
    permissions:
      contents: read
    uses: kauevestena/oswm_codebase/.github/workflows/node_replication_preview.yml@e2e29d559f410de21bc3862098bd703eae817025
    with:
      core_ref: e2e29d559f410de21bc3862098bd703eae817025
      bootstrap_url: ${{ github.event_name == 'push' && 'https://download.geofabrik.de/south-america/brazil/sul-261027.osm.pbf' || inputs.bootstrap_url }}
      start_sequence: ${{ github.event_name == 'push' && '2504' || inputs.start_sequence }}
      end_sequence: ${{ github.event_name == 'push' && '2506' || inputs.end_sequence }}
