name: data_daily_updating

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      force_regeneration:
        description: Rebuild the complete derived output set
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  data_daily_updating:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      OSWM_FORCE_REGEN: ${{ inputs.force_regeneration || 'false' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oswm_codebase/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - uses: actions/cache@v4
        with:
          path: .cache/oswm/elevation
          key: oswm-elevation-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: oswm-elevation-${{ runner.os }}-
      - run: python -m pip install -r oswm_codebase/requirements.txt
      - run: bash oswm_codebase/runners/daily.sh
      - name: Validate every generated PMTiles layer
        run: python oswm_codebase/other/auxiliary_scripts/validate_tiles.py
      - name: Commit generated data
        run: |
          python oswm_codebase/node_outputs.py --root . stage daily
          python oswm_codebase/node_outputs.py --root . validate-sizes --max-mib 95
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "data: refresh node products $(date -u +%F)"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
