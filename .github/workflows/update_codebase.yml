name: Update oswm_codebase submodule

on:
  schedule:
    - cron: "30 5 * * *"
  workflow_dispatch:
    inputs:
      revision:
        description: Exact oswm_codebase commit SHA already tested on main
        required: false
        type: string

permissions:
  contents: write
  actions: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  bump_submodule:
    permissions:
      contents: write
      actions: write
    uses: kauevestena/oswm_codebase/.github/workflows/node_codebase_sync.yml@main
    with:
      revision: ${{ inputs.revision || '' }}
