name: One-shot fleet recovery

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/fleet_recovery.yml"

permissions:
  contents: write
  actions: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      PYTHONUNBUFFERED: "1"
      OSWM_FORCE_REGEN: "true"
      OSWM_FORCE_BASEMAP_REGEN: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oswm_codebase/requirements.txt
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gdal-bin libgdal-dev
      - uses: actions/cache@v4
        with:
          path: |
            .cache/oswm/elevation
            .cache/oswm/basemaps
          key: oswm-recovery-${{ runner.os }}-${{ hashFiles('config.py') }}
          restore-keys: oswm-recovery-${{ runner.os }}-
      - run: python -m pip install -r oswm_codebase/requirements.txt
      - name: Force complete node regeneration
        run: bash oswm_codebase/runners/daily.sh
      - name: Validate generated PMTiles
        run: python oswm_codebase/other/auxiliary_scripts/validate_tiles.py
      - name: Commit recovered products
        run: |
          python oswm_codebase/node_outputs.py --root . stage daily
          python oswm_codebase/node_outputs.py --root . validate-sizes --max-mib 95
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --cached --quiet; then
            git commit -m "data: recover node products with raster PMTiles basemaps"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - name: Deploy recovered site
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
