name: updates_weekly

on:
  schedule:
    - cron: "5 8 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  updates_weekly:
    permissions:
      contents: write
      actions: write
    uses: kauevestena/oswm_codebase/.github/workflows/node_build.yml@main
    with:
      mode: weekly
      core_ref: main
