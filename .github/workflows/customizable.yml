name: customizable

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: oswm-node-writer-${{ github.repository }}
  cancel-in-progress: false

jobs:
  custom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: oswm_codebase/requirements.txt
      - run: python -m pip install -r oswm_codebase/requirements.txt
      - run: bash oswm_codebase/runners/custom.sh
      - name: Commit declared products
        id: commit
        run: |
          echo "changed=false" >> "$GITHUB_OUTPUT"
          python oswm_codebase/node_outputs.py --root . stage custom
          python oswm_codebase/node_outputs.py --root . validate-sizes --max-mib 95
          if git diff --cached --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -m "chore: run custom node job"
          git fetch origin "$GITHUB_REF_NAME"
          git rebase "origin/$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Deploy published changes
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref "$GITHUB_REF_NAME"
